<div *ngIf="isVisible" class="fixed inset-0 z-50 flex items-start justify-center p-4 bg-black/60 backdrop-blur-sm overflow-y-auto">
  <div class="relative w-full max-w-lg my-6 bg-white rounded-2xl shadow-2xl flex flex-col">

    <!-- Header -->
    <div class="flex items-center justify-between px-6 py-4 bg-gradient-to-r from-blue-600 to-blue-800 rounded-t-2xl">
      <div class="flex items-center gap-3">
        <div class="w-9 h-9 bg-white/20 rounded-lg flex items-center justify-center">
          <svg class="w-5 h-5 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
              d="M18 9v3m0 0v3m0-3h3m-3 0h-3m-2-5a4 4 0 11-8 0 4 4 0 018 0zM3 20a6 6 0 0112 0v1H3v-1z" />
          </svg>
        </div>
        <div>
          <h2 class="text-lg font-bold text-white">{{ roleData ? 'Editar Rol' : 'Crear Nuevo Rol' }}</h2>
          <p class="text-xs text-blue-200">Completa los campos requeridos (marcados con *)</p>
        </div>
      </div>
      <button type="button" (click)="onClose()"
        class="w-8 h-8 flex items-center justify-center rounded-lg text-white/80 hover:text-white hover:bg-white/20 transition-colors">
        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12" />
        </svg>
      </button>
    </div>

    <!-- Body -->
    <form [formGroup]="form" (ngSubmit)="onSubmit()" class="flex-1 overflow-y-auto p-6 space-y-5">

      <!-- Error Alert -->
      <div *ngIf="errorMessage" class="p-3 bg-red-50 border border-red-200 text-red-700 rounded-lg text-sm flex items-start gap-2">
        <svg class="w-5 h-5 shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4m0 4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z" />
        </svg>
        <span>{{ errorMessage }}</span>
      </div>

      <!-- Nombre -->
      <div class="space-y-1">
        <label class="text-xs font-semibold text-gray-700 uppercase tracking-wider">Nombre del rol</label>
        <input type="text" formControlName="name" placeholder="Ej: Asesor"
          class="w-full px-4 py-2 bg-gray-50 border border-gray-200 rounded-lg focus:ring-2 focus:ring-blue-500 focus:bg-white transition-all outline-none"
          [ngClass]="{'border-red-500': form.get('name')?.touched && form.get('name')?.invalid}">
      </div>

      <!-- Descripción -->
      <div class="space-y-1">
        <label class="text-xs font-semibold text-gray-700 uppercase tracking-wider">Descripción</label>
        <textarea formControlName="description" rows="3" placeholder="Descripción del rol"
          class="w-full px-4 py-2 bg-gray-50 border border-gray-200 rounded-lg focus:ring-2 focus:ring-blue-500 focus:bg-white transition-all outline-none resize-none"></textarea>
      </div>

      <!-- Footer -->
      <div class="pt-2 flex items-center justify-end gap-3 border-t border-gray-100 mt-2">
        <button type="button" (click)="onClose()"
          class="px-4 py-2 text-sm font-medium text-gray-600 hover:text-gray-800 transition-colors">
          Cancelar
        </button>
        <button type="submit" [disabled]="form.invalid || isSubmitting"
          class="px-6 py-2 bg-blue-700 text-white rounded-lg text-sm font-semibold shadow-md hover:bg-blue-800 focus:ring-4 focus:ring-blue-200 disabled:opacity-50 disabled:cursor-not-allowed transition-all flex items-center gap-2">
          <svg *ngIf="isSubmitting" class="animate-spin h-4 w-4 text-white" fill="none" viewBox="0 0 24 24">
            <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
            <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
          </svg>
          {{ isSubmitting ? 'Procesando...' : 'Guardar Rol' }}
        </button>
      </div>
    </form>
  </div>
</div>
