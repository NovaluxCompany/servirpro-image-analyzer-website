@if (documents().length) {
  <div>
    <button type="button" #docBtn
      (click)="toggle($event, docBtn)"
      class="inline-flex items-center gap-1.5 px-2 py-1 text-xs font-medium text-gray-600 bg-white border border-gray-300 rounded-lg hover:bg-gray-50 hover:text-gray-800 transition-colors"
      title="Ver soportes"
    >
      <svg class="w-3.5 h-3.5 shrink-0 text-gray-400" fill="none" stroke="currentColor" viewBox="0 0 24 24" aria-hidden="true">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
          d="M7 21h10a2 2 0 002-2V9.414a1 1 0 00-.293-.707l-5.414-5.414A1 1 0 0012.586 3H7a2 2 0 00-2 2v14a2 2 0 002 2z" />
      </svg>
      <span class="tabular-nums">{{ documents().length }}</span>
      <svg class="w-3.5 h-3.5 shrink-0" fill="currentColor" viewBox="0 0 24 24" aria-hidden="true">
        <circle cx="12" cy="5" r="1.5" /><circle cx="12" cy="12" r="1.5" /><circle cx="12" cy="19" r="1.5" />
      </svg>
    </button>

    @if (isOpen()) {
      <div class="fixed z-50 w-64 py-1 overflow-y-auto bg-white border border-gray-200 rounded-lg shadow-lg"
        [style.top.px]="dropdownPos().top"
        [style.bottom.px]="dropdownPos().bottom"
        [style.left.px]="dropdownPos().left"
        [style.max-height.px]="dropdownPos().maxHeight">
        @for (document of documents(); track document.id) {
          <button
            type="button"
            (click)="open(document); close()"
            [disabled]="openingId() === document.id"
            class="flex items-center w-full gap-2 px-3 py-2 text-xs text-left transition-colors disabled:opacity-50"
            [class]="document.isSensitive ? 'text-amber-800 hover:bg-amber-50' : 'text-gray-700 hover:bg-gray-50'"
            [title]="tooltip(document)"
          >
            @if (openingId() === document.id) {
              <svg class="w-3.5 h-3.5 shrink-0 animate-spin" fill="none" viewBox="0 0 24 24" aria-hidden="true">
                <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
                <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8v4a4 4 0 00-4 4H4z"></path>
              </svg>
            } @else if (document.isSensitive) {
              <svg class="w-3.5 h-3.5 shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24" aria-hidden="true">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                  d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z" />
              </svg>
            } @else {
              <svg class="w-3.5 h-3.5 shrink-0 text-gray-400" fill="none" stroke="currentColor" viewBox="0 0 24 24" aria-hidden="true">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                  d="M7 21h10a2 2 0 002-2V9.414a1 1 0 00-.293-.707l-5.414-5.414A1 1 0 0012.586 3H7a2 2 0 00-2 2v14a2 2 0 002 2z" />
              </svg>
            }
            <span class="flex-1 min-w-0 truncate">{{ label(document.documentType) }}</span>
          </button>
        }
      </div>
    }
  </div>
} @else {
  <span class="text-xs text-gray-400">Sin soportes</span>
}
