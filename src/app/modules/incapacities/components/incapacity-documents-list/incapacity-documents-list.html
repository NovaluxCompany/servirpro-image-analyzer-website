@if (documents().length) {
  <!-- Chips compactos: etiqueta corta + tooltip con el nombre completo. Con
       cinco soportes las etiquetas largas hacían crecer el alto de la fila. -->
  <div class="flex flex-wrap gap-1 max-w-[240px]">
    @for (document of documents(); track document.id) {
      <button
        type="button"
        (click)="open(document)"
        [disabled]="openingId() === document.id"
        class="inline-flex items-center gap-1 px-1.5 py-0.5 text-[11px] font-medium leading-tight border rounded-md transition-colors disabled:opacity-50"
        [class]="document.isSensitive
          ? 'border-amber-300 text-amber-800 bg-amber-50 hover:bg-amber-100'
          : 'border-gray-300 text-gray-600 hover:bg-gray-100 hover:text-gray-900'"
        [title]="tooltip(document)"
      >
        @if (openingId() === document.id) {
          <svg class="w-3 h-3 animate-spin shrink-0" fill="none" viewBox="0 0 24 24" aria-hidden="true">
            <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
            <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8v4a4 4 0 00-4 4H4z"></path>
          </svg>
        } @else if (document.isSensitive) {
          <svg class="w-3 h-3 shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24" aria-hidden="true">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
              d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z" />
          </svg>
        } @else {
          <svg class="w-3 h-3 shrink-0 text-gray-400" fill="none" stroke="currentColor" viewBox="0 0 24 24" aria-hidden="true">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
              d="M7 21h10a2 2 0 002-2V9.414a1 1 0 00-.293-.707l-5.414-5.414A1 1 0 0012.586 3H7a2 2 0 00-2 2v14a2 2 0 002 2z" />
          </svg>
        }
        {{ shortLabel(document.documentType) }}
      </button>
    }
  </div>
} @else {
  <span class="text-xs text-gray-400">Sin soportes</span>
}
