@if (documents().length) {
  <div class="flex flex-wrap gap-2">
    @for (document of documents(); track document.id) {
      <button
        type="button"
        (click)="open(document)"
        [disabled]="openingId() === document.id"
        class="inline-flex items-center gap-1.5 px-2.5 py-1 text-xs font-medium border rounded-lg transition-colors disabled:opacity-50"
        [class]="document.isSensitive
          ? 'border-amber-300 text-amber-800 bg-amber-50 hover:bg-amber-100'
          : 'border-gray-300 text-gray-700 hover:bg-gray-100'"
        [title]="document.isSensitive
          ? 'Dato sensible: requiere permiso y queda registrada la consulta'
          : 'Abrir en una pestaña nueva'"
      >
        @if (document.isSensitive) {
          <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24" aria-hidden="true">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z" />
          </svg>
        }
        {{ label(document.documentType) }}
      </button>
    }
  </div>
} @else {
  <span class="text-gray-400">Sin soportes</span>
}
