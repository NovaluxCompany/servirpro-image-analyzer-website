<div class="mb-6 p-4 bg-white border border-gray-200 rounded-lg shadow-sm">
  <h3 class="mb-4 text-lg font-semibold text-gray-900">Filtros de búsqueda</h3>

  <form [formGroup]="form" (ngSubmit)="onSearch()" class="grid grid-cols-1 gap-4 md:grid-cols-2 lg:grid-cols-4">
    <div>
      <label for="dateFrom" class="block mb-2 text-sm font-medium text-gray-900">Fecha desde <span class="text-red-600">*</span></label>
      <input
        type="date"
        id="dateFrom"
        formControlName="dateFrom"
        class="bg-gray-50 border border-gray-300 text-gray-900 text-sm rounded-lg focus:ring-blue-500 focus:border-blue-500 block w-full p-2.5"
      >
      @if (form.controls.dateFrom.invalid && form.controls.dateFrom.touched) {
      <p class="mt-1 text-xs text-red-600">La fecha desde es obligatoria</p>
      }
    </div>

    <div>
      <label for="dateTo" class="block mb-2 text-sm font-medium text-gray-900">Fecha hasta <span class="text-red-600">*</span></label>
      <input
        type="date"
        id="dateTo"
        formControlName="dateTo"
        class="bg-gray-50 border border-gray-300 text-gray-900 text-sm rounded-lg focus:ring-blue-500 focus:border-blue-500 block w-full p-2.5"
      >
      @if (form.controls.dateTo.invalid && form.controls.dateTo.touched) {
      <p class="mt-1 text-xs text-red-600">La fecha hasta es obligatoria</p>
      }
    </div>

    <div>
      <label for="status" class="block mb-2 text-sm font-medium text-gray-900">Estado</label>
      <select
        id="status"
        formControlName="status"
        class="bg-gray-50 border border-gray-300 text-gray-900 text-sm rounded-lg focus:ring-blue-500 focus:border-blue-500 block w-full p-2.5"
      >
        <option value="">Todos</option>
        <option value="PENDING">Pendiente envío</option>
        <option value="INVOICED">Enviado</option>
        <option value="ERROR">Error</option>
      </select>
    </div>

    <div class="flex items-end gap-2">
      <button
        type="submit"
        class="flex-1 text-white bg-blue-700 hover:bg-blue-800 focus:ring-4 focus:outline-none focus:ring-blue-300 font-medium rounded-lg text-sm px-5 py-2.5 text-center"
      >
        Buscar
      </button>
      <button
        type="button"
        (click)="onClear()"
        class="flex-1 text-gray-900 bg-white border border-gray-300 hover:bg-gray-100 focus:ring-4 focus:outline-none focus:ring-gray-200 font-medium rounded-lg text-sm px-5 py-2.5 text-center"
      >
        Limpiar
      </button>
    </div>
  </form>
</div>
