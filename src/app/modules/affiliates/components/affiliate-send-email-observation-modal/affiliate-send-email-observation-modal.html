@if (isVisible() && affiliate(); as a) {
  <div class="fixed inset-0 z-50 flex items-center justify-center p-4 bg-black/60 backdrop-blur-sm">
    <div class="relative w-full max-w-md bg-white rounded-2xl shadow-2xl overflow-hidden">

      <!-- Header -->
      <div class="flex items-center gap-3 px-6 py-4 bg-gradient-to-r from-blue-600 to-blue-700">
        <div class="w-9 h-9 bg-white/20 rounded-lg flex items-center justify-center">
          <svg class="w-5 h-5 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
              d="M3 8l7.89 5.26a2 2 0 002.22 0L21 8M5 19h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z" />
          </svg>
        </div>
        <h3 class="text-base font-bold text-white">Enviar correo de afiliación</h3>
      </div>

      <!-- Body -->
      <div class="px-6 py-5">
        <p class="text-sm text-gray-700 mb-4">
          Se enviará al correo registrado de <strong>{{ a.fullName }}</strong>.
          Puedes agregar una observación específica para este correo antes de enviarlo.
        </p>

        <label class="text-xs font-semibold text-gray-700 uppercase tracking-wider">Observación para el correo (opcional)</label>
        <textarea [(ngModel)]="observation" rows="4" placeholder="Observación específica para este envío..."
          class="w-full mt-1 px-4 py-2 bg-gray-50 border border-gray-200 rounded-lg focus:ring-2 focus:ring-blue-500 focus:bg-white transition-all outline-none text-sm resize-none"></textarea>
      </div>

      <!-- Footer -->
      <div class="flex items-center justify-end gap-3 px-6 py-4 bg-gray-50 border-t border-gray-200">
        <button type="button" (click)="onCancel()" [disabled]="isLoading()"
          class="px-4 py-2 text-sm font-medium text-gray-700 bg-white border border-gray-300 rounded-lg hover:bg-gray-50 transition-colors disabled:opacity-50">
          Cancelar
        </button>
        <button type="button" (click)="onConfirm()" [disabled]="isLoading()"
          class="inline-flex items-center gap-2 px-5 py-2 text-sm font-medium text-white bg-blue-700 hover:bg-blue-800 focus:ring-4 focus:ring-blue-300 rounded-lg transition-all disabled:opacity-50 disabled:cursor-not-allowed">
          @if (isLoading()) {
            <svg class="w-4 h-4 animate-spin" fill="none" viewBox="0 0 24 24">
              <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"/>
              <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4z"/>
            </svg>
            Enviando...
          } @else {
            Enviar correo
          }
        </button>
      </div>

    </div>
  </div>
}
