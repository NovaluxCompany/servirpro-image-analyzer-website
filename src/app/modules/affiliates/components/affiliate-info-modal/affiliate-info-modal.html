@if (isVisible() && affiliate()) {
  <div class="fixed inset-0 z-50 flex items-center justify-center p-4 bg-black/60 backdrop-blur-sm">
    <div class="relative flex flex-col w-full max-w-4xl max-h-[90vh] overflow-hidden bg-white shadow-2xl rounded-2xl">

      <!-- Header -->
      <div class="flex items-center justify-between gap-3 px-6 py-4 bg-gradient-to-r from-blue-600 to-blue-800">
        <div class="flex items-center gap-3">
          <div class="flex items-center justify-center rounded-lg w-9 h-9 bg-white/20">
            <svg class="w-5 h-5 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" />
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.477 0 8.268 2.943 9.542 7-1.274 4.057-5.065 7-9.542 7-4.477 0-8.268-2.943-9.542-7z" />
            </svg>
          </div>
          <h3 class="text-base font-bold text-white">Información del afiliado</h3>
        </div>
        <button type="button" (click)="onClose()" class="transition-colors text-white/80 hover:text-white" aria-label="Cerrar">
          <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12" />
          </svg>
        </button>
      </div>

      <!-- Pestañas -->
      <div class="flex gap-1 px-6 border-b border-gray-200 bg-gray-50" role="tablist">
        <button type="button" role="tab" [attr.aria-selected]="activeTab() === 'datos'"
          (click)="activeTab.set('datos')"
          class="px-4 py-3 text-sm font-medium transition-colors border-b-2"
          [class]="activeTab() === 'datos'
            ? 'border-blue-600 text-blue-700'
            : 'border-transparent text-gray-500 hover:text-gray-700'">
          Datos básicos
        </button>
        <button type="button" role="tab" [attr.aria-selected]="activeTab() === 'incapacidades'"
          (click)="activeTab.set('incapacidades')"
          class="px-4 py-3 text-sm font-medium transition-colors border-b-2"
          [class]="activeTab() === 'incapacidades'
            ? 'border-blue-600 text-blue-700'
            : 'border-transparent text-gray-500 hover:text-gray-700'">
          Incapacidades
        </button>
      </div>

      <!-- Contenido -->
      <div class="px-6 py-5 overflow-y-auto">
        @switch (activeTab()) {
          @case ('datos') {
            <app-affiliate-basic-data-tab [affiliate]="affiliate()" />
          }
          @case ('incapacidades') {
            <!-- enabled se activa solo al abrir la pestaña: no se pide el
                 histórico mientras el usuario está en Datos básicos. -->
            <app-incapacity-history
              [affiliationId]="affiliationId()"
              [enabled]="activeTab() === 'incapacidades'" />
          }
        }
      </div>

      <!-- Footer -->
      <div class="flex items-center justify-end gap-3 px-6 py-4 border-t border-gray-200 bg-gray-50">
        <button type="button" (click)="onClose()"
          class="px-4 py-2 text-sm font-medium text-gray-700 transition-colors bg-white border border-gray-300 rounded-lg hover:bg-gray-50">
          Cerrar
        </button>
      </div>

    </div>
  </div>
}
