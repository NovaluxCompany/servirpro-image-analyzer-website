@if (isVisible() && affiliate()) {
  <div class="fixed inset-0 z-50 flex items-center justify-center p-4 bg-black/60 backdrop-blur-sm">
    <div class="relative w-full max-w-md bg-white rounded-2xl shadow-2xl overflow-hidden">

      <!-- Header -->
      <div class="flex items-center gap-3 px-6 py-4 bg-gradient-to-r from-red-600 to-red-700">
        <div class="w-9 h-9 bg-white/20 rounded-lg flex items-center justify-center">
          <svg class="w-5 h-5 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
              d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-2.5L13.732 4c-.77-.833-1.964-.833-2.732 0L3.07 16.5c-.77.833.192 2.5 1.732 2.5z" />
          </svg>
        </div>
        <h3 class="text-base font-bold text-white">Desafiliar Afiliado</h3>
      </div>

      <!-- Body -->
      <div class="px-6 py-5">
        <p class="text-center text-sm text-gray-700 leading-relaxed" [innerHTML]="confirmMessage"></p>
        <p class="mt-3 text-center text-xs text-gray-400">
          Esta solicitud quedará pendiente de validación en el módulo Desactivar Afiliados.
        </p>

        <div class="mt-4">
          <label class="block mb-1 text-xs font-medium text-gray-600">Motivo de desafiliación <span class="text-red-500">*</span></label>
          <select [(ngModel)]="reasonId" (ngModelChange)="showReasonError = false"
            [class.border-red-400]="showReasonError"
            class="w-full px-3 py-2 text-sm border border-gray-300 rounded-lg focus:ring-2 focus:ring-red-500 focus:border-red-500">
            <option [value]="null" disabled>Selecciona un motivo</option>
            @for (opt of reasonOptions; track opt.value) {
              <option [value]="opt.value">{{ opt.label }}</option>
            }
          </select>
          @if (showReasonError) {
            <p class="mt-1 text-xs text-red-500">Debes seleccionar un motivo.</p>
          }
        </div>

        <div class="mt-3">
          <label class="block mb-1 text-xs font-medium text-gray-600">Empresa</label>
          <app-searchable-select [options]="companyOptions" [(ngModel)]="companyId"
            placeholder="Seleccionar empresa...">
          </app-searchable-select>
        </div>

        <div class="mt-3">
          <label class="block mb-1 text-xs font-medium text-gray-600">Observación (opcional)</label>
          <textarea [(ngModel)]="observation" rows="3" maxlength="2000"
            placeholder="Detalle adicional sobre el motivo seleccionado"
            class="w-full px-3 py-2 text-sm border border-gray-300 rounded-lg focus:ring-2 focus:ring-red-500 focus:border-red-500"></textarea>
        </div>
      </div>

      <!-- Footer -->
      <div class="flex items-center justify-end gap-3 px-6 py-4 bg-gray-50 border-t border-gray-200">
        <button type="button" (click)="onCancel()" [disabled]="isLoading()"
          class="px-4 py-2 text-sm font-medium text-gray-700 bg-white border border-gray-300 rounded-lg hover:bg-gray-50 transition-colors disabled:opacity-50">
          Cancelar
        </button>
        <button type="button" (click)="onConfirm()" [disabled]="isLoading()"
          class="inline-flex items-center gap-2 px-5 py-2 text-sm font-medium text-white bg-red-600 rounded-lg hover:bg-red-700 focus:ring-4 focus:ring-red-300 transition-all disabled:opacity-50 disabled:cursor-not-allowed">
          @if (isLoading()) {
            <svg class="w-4 h-4 animate-spin" fill="none" viewBox="0 0 24 24">
              <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"/>
              <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4z"/>
            </svg>
            Procesando...
          } @else {
            Desafiliar afiliado
          }
        </button>
      </div>

    </div>
  </div>
}
