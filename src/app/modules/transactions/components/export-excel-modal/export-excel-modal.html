@if (isVisible()) {
  <div class="fixed inset-0 z-50 flex items-center justify-center p-4 bg-black/60 backdrop-blur-sm">
    <div class="relative w-full max-w-md bg-white rounded-2xl shadow-2xl overflow-hidden">

      <!-- Header -->
      <div class="flex items-center gap-3 px-6 py-4 bg-gradient-to-r from-green-600 to-green-700">
        <div class="w-9 h-9 bg-white/20 rounded-lg flex items-center justify-center">
          <svg class="w-5 h-5 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 10v6m0 0l-3-3m3 3l3-3m2 8H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z" />
          </svg>
        </div>
        <h3 class="text-base font-bold text-white">Descargar Excel</h3>
      </div>

      <!-- Body -->
      <div class="px-6 py-5">
        <p class="text-sm text-gray-700 mb-4">
          Selecciona el rango de fechas a exportar. El rango máximo permitido es de 1 mes.
        </p>

        <div class="grid grid-cols-2 gap-3">
          <div class="space-y-1">
            <label class="text-xs font-semibold text-gray-700 uppercase tracking-wider">Fecha inicial</label>
            <input type="date" [(ngModel)]="dateFrom"
              class="w-full px-4 py-2 bg-gray-50 border border-gray-200 rounded-lg focus:ring-2 focus:ring-green-500 focus:bg-white transition-all outline-none text-sm">
          </div>
          <div class="space-y-1">
            <label class="text-xs font-semibold text-gray-700 uppercase tracking-wider">Fecha final</label>
            <input type="date" [(ngModel)]="dateTo"
              class="w-full px-4 py-2 bg-gray-50 border border-gray-200 rounded-lg focus:ring-2 focus:ring-green-500 focus:bg-white transition-all outline-none text-sm">
          </div>
        </div>

        @if (errorMessage(); as err) {
        <p class="mt-3 text-xs text-red-600">{{ err }}</p>
        }
      </div>

      <!-- Footer -->
      <div class="flex items-center justify-end gap-3 px-6 py-4 bg-gray-50 border-t border-gray-200">
        <button type="button" (click)="onCancel()" [disabled]="isDownloading()"
          class="px-4 py-2 text-sm font-medium text-gray-700 bg-white border border-gray-300 rounded-lg hover:bg-gray-50 transition-colors disabled:opacity-50">
          Cancelar
        </button>
        <button type="button" (click)="onConfirm()" [disabled]="isDownloading()"
          class="inline-flex items-center gap-2 px-5 py-2 text-sm font-medium text-white bg-green-600 hover:bg-green-700 focus:ring-4 focus:ring-green-300 rounded-lg transition-all disabled:opacity-50 disabled:cursor-not-allowed">
          @if (isDownloading()) {
            <svg class="w-4 h-4 animate-spin" fill="none" viewBox="0 0 24 24">
              <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"/>
              <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4z"/>
            </svg>
            Descargando...
          } @else {
            Descargar
          }
        </button>
      </div>

    </div>
  </div>
}
