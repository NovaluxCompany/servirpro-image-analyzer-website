@if (isVisible()) {
  <div class="fixed inset-0 z-50 flex items-center justify-center p-4 bg-black/60 backdrop-blur-sm">
    <div class="relative w-full max-w-3xl bg-white rounded-2xl shadow-2xl overflow-hidden">

      <!-- Header -->
      <div class="flex items-center justify-between gap-3 px-6 py-4 bg-gradient-to-r from-blue-600 to-blue-700">
        <div class="flex items-center gap-3">
          <div class="w-9 h-9 bg-white/20 rounded-lg flex items-center justify-center">
            <svg class="w-5 h-5 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 7h6m0 10v-3m-3 3h.01M9 17h.01M9 14h.01M12 14h.01M15 11h.01M12 11h.01M9 11h.01M7 21h10a2 2 0 002-2V5a2 2 0 00-2-2H7a2 2 0 00-2 2v14a2 2 0 002 2z" />
            </svg>
          </div>
          <h3 class="text-base font-bold text-white">Gestión de Planes</h3>
        </div>
        <button type="button" (click)="onClose()" class="text-white/80 hover:text-white">
          <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12" />
          </svg>
        </button>
      </div>

      <!-- Body -->
      <div class="px-6 py-5 max-h-[70vh] overflow-y-auto">
        @if (isLoading()) {
        <p class="text-sm text-gray-400 italic text-center py-6">Cargando planes...</p>
        } @else {

        <div class="overflow-x-auto border border-gray-100 rounded-xl">
          <table class="w-full text-sm">
            <thead class="bg-gray-50 text-xs uppercase text-gray-500 tracking-wider">
              <tr>
                <th class="text-left px-4 py-2">Plan</th>
                <th class="text-left px-4 py-2">Precio venta</th>
                <th class="text-left px-4 py-2">Precio primer mes</th>
                <th class="px-4 py-2"></th>
              </tr>
            </thead>
            <tbody>
              @for (row of rows(); track row.plan.id) {
              <tr class="border-t border-gray-100">
                <td class="px-4 py-2 font-medium text-gray-800">{{ row.plan.name }}</td>
                <td class="px-4 py-2">
                  <input type="number" min="0" [(ngModel)]="row.salePrice"
                    class="w-32 px-2 py-1 bg-gray-50 border border-gray-200 rounded-lg focus:ring-2 focus:ring-blue-500 focus:bg-white outline-none text-sm">
                </td>
                <td class="px-4 py-2">
                  <input type="number" min="0" [(ngModel)]="row.firstMonthPrice"
                    placeholder="= precio venta"
                    class="w-32 px-2 py-1 bg-gray-50 border border-gray-200 rounded-lg focus:ring-2 focus:ring-blue-500 focus:bg-white outline-none text-sm">
                </td>
                <td class="px-4 py-2 text-right">
                  <button type="button" (click)="saveRow(row)" [disabled]="savingId() === row.plan.id"
                    class="px-3 py-1.5 text-xs font-semibold text-white bg-blue-700 rounded-lg hover:bg-blue-800 disabled:opacity-50">
                    @if (savingId() === row.plan.id) { Guardando... } @else { Guardar }
                  </button>
                </td>
              </tr>
              }
              @if (rows().length === 0) {
              <tr>
                <td colspan="4" class="px-4 py-6 text-center text-xs text-gray-400 italic">No hay planes configurados.</td>
              </tr>
              }
            </tbody>
          </table>
        </div>

        <!-- Crear plan -->
        <div class="mt-6 border-t border-gray-100 pt-4">
          <h4 class="text-sm font-bold text-gray-700 uppercase tracking-wider mb-3">Nuevo plan</h4>
          <div class="grid grid-cols-1 sm:grid-cols-3 gap-3">
            <input type="text" [(ngModel)]="newName" placeholder="Nombre del plan"
              class="px-4 py-2 bg-gray-50 border border-gray-200 rounded-lg focus:ring-2 focus:ring-blue-500 focus:bg-white outline-none text-sm">
            <input type="number" min="0" [(ngModel)]="newSalePrice" placeholder="Precio venta"
              class="px-4 py-2 bg-gray-50 border border-gray-200 rounded-lg focus:ring-2 focus:ring-blue-500 focus:bg-white outline-none text-sm">
            <input type="number" min="0" [(ngModel)]="newFirstMonthPrice" placeholder="Precio primer mes (opcional)"
              class="px-4 py-2 bg-gray-50 border border-gray-200 rounded-lg focus:ring-2 focus:ring-blue-500 focus:bg-white outline-none text-sm">
          </div>
          <div class="flex justify-end mt-3">
            <button type="button" (click)="createPlan()" [disabled]="isCreating()"
              class="px-5 py-2 text-sm font-semibold text-white bg-emerald-600 rounded-lg hover:bg-emerald-700 disabled:opacity-50">
              @if (isCreating()) { Creando... } @else { Crear plan }
            </button>
          </div>
        </div>
        }
      </div>

      <!-- Footer -->
      <div class="flex items-center justify-end gap-3 px-6 py-4 bg-gray-50 border-t border-gray-200">
        <button type="button" (click)="onClose()"
          class="px-4 py-2 text-sm font-medium text-gray-700 bg-white border border-gray-300 rounded-lg hover:bg-gray-50 transition-colors">
          Cerrar
        </button>
      </div>

    </div>
  </div>
}
