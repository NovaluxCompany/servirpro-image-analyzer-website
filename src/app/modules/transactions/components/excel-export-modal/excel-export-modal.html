@if (isVisible()) {
  <div class="fixed inset-0 z-50 flex items-center justify-center p-4 bg-black/60 backdrop-blur-sm">
    <div class="relative w-full max-w-md bg-white rounded-2xl shadow-2xl overflow-hidden">

      <!-- Header -->
      <div class="flex items-center gap-3 px-6 py-4 bg-gradient-to-r from-green-600 to-green-700">
        <div class="w-9 h-9 bg-white/20 rounded-lg flex items-center justify-center">
          <svg class="w-5 h-5 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 10v6m0 0l-3-3m3 3l3-3m2 8H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z" />
          </svg>
        </div>
        <h3 class="text-base font-bold text-white">Descargar Excel de Transacciones</h3>
      </div>

      <!-- Body -->
      <form [formGroup]="form" (ngSubmit)="onConfirm()">
        <div class="px-6 py-5">
          <p class="text-sm text-gray-600 mb-4">
            Selecciona el rango de fechas a exportar. El rango máximo permitido es de <strong>un mes</strong>.
          </p>

          <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
            <div>
              <label for="excel-export-date-from" class="block mb-1 text-sm font-medium text-gray-700">Fecha inicial</label>
              <input
                id="excel-export-date-from"
                type="date"
                formControlName="dateFrom"
                class="w-full px-3 py-2 text-sm border border-gray-300 rounded-lg focus:ring-2 focus:ring-green-300 focus:border-green-500"
              />
            </div>
            <div>
              <label for="excel-export-date-to" class="block mb-1 text-sm font-medium text-gray-700">Fecha final</label>
              <input
                id="excel-export-date-to"
                type="date"
                formControlName="dateTo"
                class="w-full px-3 py-2 text-sm border border-gray-300 rounded-lg focus:ring-2 focus:ring-green-300 focus:border-green-500"
              />
            </div>
          </div>

          @if (errorMessage()) {
            <div class="mt-4 p-3 text-sm text-red-800 rounded-lg bg-red-100" role="alert">
              {{ errorMessage() }}
            </div>
          }
        </div>

        <!-- Footer -->
        <div class="flex items-center justify-end gap-3 px-6 py-4 bg-gray-50 border-t border-gray-200">
          <button type="button" (click)="onCancel()" [disabled]="isLoading()"
            class="px-4 py-2 text-sm font-medium text-gray-700 bg-white border border-gray-300 rounded-lg hover:bg-gray-50 transition-colors disabled:opacity-50">
            Cancelar
          </button>
          <button type="submit" [disabled]="isLoading()"
            class="inline-flex items-center gap-2 px-5 py-2 text-sm font-medium text-white bg-green-600 rounded-lg hover:bg-green-700 focus:ring-4 focus:ring-green-300 transition-all disabled:opacity-50 disabled:cursor-not-allowed">
            @if (isLoading()) {
              <svg class="w-4 h-4 animate-spin" fill="none" viewBox="0 0 24 24">
                <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"/>
                <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4z"/>
              </svg>
              Descargando...
            } @else {
              Descargar
            }
          </button>
        </div>
      </form>

    </div>
  </div>
}
