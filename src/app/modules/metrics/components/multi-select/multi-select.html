<div class="relative">
  <label class="block mb-1 text-xs font-medium text-gray-600">{{ label() }}</label>
  <button type="button" (click)="toggleOpen()"
    class="flex w-full items-center justify-between gap-2 rounded-lg border border-gray-300 bg-white px-3 py-2 text-left text-sm text-gray-900 hover:border-gray-400 focus:outline-none focus:ring-2 focus:ring-blue-300">
    <span class="truncate" [class.text-gray-500]="selected().length === 0">{{ summary() }}</span>
    <svg class="h-4 w-4 shrink-0 text-gray-400" fill="none" stroke="currentColor" viewBox="0 0 24 24" aria-hidden="true">
      <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7" />
    </svg>
  </button>

  @if (isOpen()) {
  <div class="absolute z-40 mt-1 w-full min-w-[220px] rounded-lg border border-gray-200 bg-white shadow-lg">
    <div class="border-b border-gray-100 p-2">
      <input type="text" [ngModel]="search()" (ngModelChange)="search.set($event)" placeholder="Buscar..."
        class="w-full rounded-md border border-gray-300 px-2 py-1.5 text-sm focus:outline-none focus:ring-2 focus:ring-blue-300" />
    </div>
    <ul class="max-h-56 overflow-y-auto py-1">
      @for (option of filteredOptions(); track option.value) {
      <li>
        <label class="flex cursor-pointer items-center gap-2 px-3 py-1.5 text-sm text-gray-700 hover:bg-gray-50">
          <input type="checkbox" [checked]="isSelected(option.value)" (change)="toggle(option.value)"
            class="h-4 w-4 rounded border-gray-300 text-blue-600 focus:ring-blue-300" />
          <span class="truncate">{{ option.label }}</span>
        </label>
      </li>
      } @empty {
      <li class="px-3 py-2 text-sm text-gray-500">Sin resultados</li>
      }
    </ul>
    @if (selected().length > 0) {
    <div class="border-t border-gray-100 p-2">
      <button type="button" (click)="clear()" class="text-xs font-medium text-blue-700 hover:underline">Quitar selección (todos)</button>
    </div>
    }
  </div>
  }
</div>
