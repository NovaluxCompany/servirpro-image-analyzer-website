<!-- Barra de scroll horizontal "espejo", siempre visible arriba de la tabla -->
<div #topScroll (scroll)="onTopScroll()" class="overflow-x-auto overflow-y-hidden">
  <div #topScrollInner style="height: 1px;"></div>
</div>

<!-- Contenedor real: scroll horizontal + vertical acotado para que el thead
     (con clase sticky top-0) quede fijo mientras se baja dentro de la tabla -->
<div #mainScroll (scroll)="onMainScroll()" class="overflow-auto max-h-[65vh]">
  <ng-content></ng-content>
</div>
